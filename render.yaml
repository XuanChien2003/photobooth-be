services:
  - type: web
    name: photobooth-be
    runtime: node
    # Standard: 1 CPU, 2 GB RAM, không ngủ. Gói Starter (512 MB) hết RAM khi vài máy chụp cùng gửi
    # ảnh 26 MP; máy chủ tự chỉnh số ảnh xử lý cùng lúc theo RAM được cấp (src/services/capacity.js).
    plan: standard
    region: singapore
    # Exact versions from package-lock.json, without test-only packages (faster, reproducible).
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    # Render chỉ chuyển sang bản mới khi bản đó trả lời được (triển khai không gián đoạn).
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Bộ cấp phát glibc mở nhiều vùng nhớ cho các luồng xử lý ảnh (sharp) và không trả RAM lại:
      # giới hạn 2 vùng giữ RAM ổn định khi chạy lâu (khuyến nghị của sharp / Node trên Linux).
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: PRINT_AGENT_TOKEN
        sync: false
      - key: MEDIA_STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
